const CARDS=[{id:"triple5",r:"rara",t:"Cada 5º disparo es triple",ic:"⋔"},{id:"dano",r:"común",t:"+15% de daño",ic:"✦"},{id:"cad",r:"común",t:"+15% de cadencia",ic:"»"},{id:"casco",r:"común",t:"+25% de vida máxima",ic:"⛨"},{id:"fuego",r:"común",t:"Las llamas duran +50%",ic:"♨"}];

// ---------- audio (WebAudio, sintetizado) ----------
let AC=null;function au(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
let mute=false;
function boom(f=70,d=.35,v=.5){const a=au();if(!a||mute)return;const t=a.currentTime,o=a.createOscillator(),gn=a.createGain();o.type="sine";o.frequency.setValueAtTime(f*2.2,t);o.frequency.exponentialRampToValueAtTime(f*.5,t+d);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn).connect(a.destination);o.start(t);o.stop(t+d);
 const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/ch.length,3);n.buffer=b;const fl=a.createBiquadFilter();fl.type="lowpass";fl.frequency.value=900;const g2=a.createGain();g2.gain.value=v*.7;n.connect(fl).connect(g2).connect(a.destination);n.start(t);}
function chime(){const a=au();if(!a||mute)return;const t=a.currentTime;[523,659,784,1046].forEach((f,i)=>{const o=a.createOscillator(),gn=a.createGain();o.type="triangle";o.frequency.value=f;gn.gain.setValueAtTime(.18,t+i*.07);gn.gain.exponentialRampToValueAtTime(.001,t+i*.07+.4);o.connect(gn).connect(a.destination);o.start(t+i*.07);o.stop(t+i*.07+.45);});}
// ---------- estado ----------
let S;function newRun(){S={t:0,mode:"play",wave:0,waveT:0,p:{x:W/2,y:H*.62,hp:100,mhp:100,inv:0,fireT:0,shots:0,dead:0},en:[],pb:[],eb:[],fx:[],nums:[],cards:[],hitstop:0,slow:1,shake:0,
 tel:{shots:0,hits:0,dmgTaken:0,reachedBoss:false,deaths:0,start:performance.now()},line:null,lineT:0,chainShown:false,book:0,boss:null,target:null,silence:0,pendingCards:0,qa:{}};}
const mod=id=>S.cards.filter(c=>c==id).length;
function say(k){S.line=DORIAN[k];S.lineT=4;}
function spawnWave(n){S.wave=n;S.waveT=0;say(n);S.reserve=[0,10,14,18][n];S.batchT=0;
 if(n==2){// grupo apretado para la primera reacción en cadena
 for(let i=0;i<4;i++)S.en.push({k:"barco",x:W*.78+(i%2)*46,y:H*.3+(i>>1)*46,hp:46,mhp:46,r:24,burn:0,fireT:2+rnd(),ang:0});}}
function spawnBoss(){S.bossAt=S.t;S.tel.reachedBoss=true;say("boss");const b={k:"boss",x:W/2,y:110,hp:600,mhp:600,r:52,burn:0,ph:"fan",phT:2,stun:0,dmgX:1,ang:Math.PI/2,ramV:null,tell:0};S.en.push(b);S.boss=b;S.wave=4;}
function offerCards(reason){S.mode="cards";S.offerReason=reason;let pool=CARDS.slice(1).sort(()=>rnd()-.5).slice(0,2);let off=[CARDS[0],...pool];if(reason=="respawn"&&S.cards.includes("triple5"))off=[CARDS[1],CARDS[2],CARDS[3]];
 showUI(`<div class="box"><div style="font-size:15px;opacity:.8">${reason=="respawn"?"Reapareces · +1 carta":"Elige una carta"}</div><div style="display:flex;gap:14px;margin-top:12px">`+off.map((c,i)=>`<div onclick="pick('${c.id}')" style="cursor:pointer;width:170px;padding:16px 10px;border:4px solid ${RB[c.r]};border-radius:14px;background:#14202e;animation:flip .45s ${i*.12}s both"><div style="font-size:54px">${c.ic}</div><div style="color:${RB[c.r]};font-size:13px;text-transform:uppercase">${c.r}</div><div style="font-size:17px;margin-top:6px">${c.t}</div></div>`).join("")+`</div><style>@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}</style></div>`);
 S.offer=off;if(AUTO)setTimeout(()=>pick(off[0].id),300);}
window.pick=id=>{if(S.mode!="cards")return;S.cards.push(id);if(id=="casco"){S.p.mhp*=1.25;S.p.hp=S.p.mhp;}hideUI();S.mode="play";if(S.offerReason=="w1")spawnWave(2);};

// ---------- disparo ----------
function nearest(x,y){let b=null,d=1e9;for(const e of S.en){const q=Math.hypot(e.x-x,e.y-y);if(q<d){d=q;b=e}}return b;}
function fire(){const p=S.p,t=nearest(p.x,p.y);if(!t)return;S.target=t;p.shots++;const a=Math.atan2(t.y-p.y,t.x-p.x),tri=mod("triple5")&&p.shots%5==0,dm=4*(1+.15*mod("dano"));
 for(const o of tri?[-.18,0,.18]:[0])S.tel.shots++,S.pb.push({x:p.x,y:p.y,vx:Math.cos(a+o)*900,vy:Math.sin(a+o)*900,d:dm,l:1,tri});boom(tri?60:85,.22,tri?.45:.25);S.shake=Math.max(S.shake,tri?5:2);
 for(let i=0;i<5;i++)S.fx.push({x:p.x+Math.cos(a)*22,y:p.y+Math.sin(a)*22,vx:Math.cos(a+rnd()-.5)*120,vy:Math.sin(a+rnd()-.5)*120,l:.35,c:"rgba(200,200,200,.6)",r:5});}
function hit(e,d,col){const crit=rnd()<.12;if(crit)d*=2;d*=e.dmgX||1;e.hp-=d;S.nums.push({x:e.x+rnd()*20-10,y:e.y-20,t:Math.round(d),c:col||(crit?COL.crit:COL.dmg),l:.8,big:crit});if(e.hp<=0)kill(e);}
function kill(e){if(e.dead)return;e.dead=true;boom(45,.5,.6);S.shake=Math.max(S.shake,8);S.hitstop=.05;for(let i=0;i<22;i++)S.fx.push({x:e.x,y:e.y,vx:(rnd()-.5)*420,vy:(rnd()-.5)*420,l:.7+rnd()*.4,c:rnd()<.5?"#ff9a2a":"#5a3a1e",r:4+rnd()*6});

 let n=0;for(const o of S.en)if(!o.dead&&o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<170){o.burn=3*(1+.5*mod("fuego"));n++;hit(o,18,COL.reac);}
 if(n>0){S.qa.chains=(S.qa.chains||0)+1;if(!S.chainShown){S.chainShown=true;S.book=1;S.banner={t:"¡REACCIÓN EN CADENA!",s:"Libro de reacciones 1/12 · Madera + fuego libre",l:2.6};chime();S.slow=.35;S.slowT=.6;}}}
 if(e.k=="boss")bossDown();}
function bossDown(){S.hitstop=0;S.slow=.15;S.slowT=1.4;S.silence=1.2;mute=true;setTimeout(()=>{mute=false;boom(30,1.4,.9);},900);S.shake=18;S.tel.won=true;

// ---------- bucle ----------
let drag=null;cv.addEventListener("pointerdown",e=>{au();drag={x:e.clientX,y:e.clientY,px:S.p.x,py:S.p.y};});addEventListener("pointermove",e=>{if(!drag)return;const s=W/cv.getBoundingClientRect().width;S.p.x=Math.max(30,Math.min(W-30,drag.px+(e.clientX-drag.x)*s*1.4));S.p.y=Math.max(30,Math.min(H-30,drag.py+(e.clientY-drag.y)*s*1.4));});addEventListener("pointerup",()=>drag=null);
function autopilot(dt){const p=S.p;let fx=0,fy=0;for(const b of S.eb){const d=Math.hypot(b.x-p.x,b.y-p.y);if(d<170){fx+=(p.x-b.x)/d/d*400;fy+=(p.y-b.y)/d/d*400;}}
 for(const e of S.en){const d=Math.hypot(e.x-p.x,e.y-p.y)||1;const want=e.k=="boss"?300:230;fx+=(e.x-p.x)/d*(d>want?.6:-.9);fy+=(e.y-p.y)/d*(d>want?.6:-.9);
 if(e.tell>0||e.ph=="ram"){const ax=Math.cos(e.ang),ay=Math.sin(e.ang),px=p.x-e.x,py=p.y-e.y,cr=ax*py-ay*px;fx+=-ay*Math.sign(cr||1)*3;fy+=ax*Math.sign(cr||1)*3;}}
 fx+=(W/2-p.x)/W;fy+=(H/2-p.y)/H;const m=Math.hypot(fx,fy)||1;p.x=Math.max(30,Math.min(W-30,p.x+fx/m*330*dt));p.y=Math.max(30,Math.min(H-30,p.y+fy/m*330*dt));}
function damageP(d){const p=S.p;if(p.inv>0||S.mode!="play")return;p.hp-=d;S.tel.dmgTaken+=d;p.inv=.6;S.shake=Math.max(S.shake,7);boom(110,.15,.3);
 if(p.hp<=0){S.tel.deaths++;p.hp=p.mhp;p.inv=2.5;S.eb=[];offerCards("respawn");}}
function step(dt){if(S.mode!="play"&&S.mode!="fin")return;if(S.hitstop>0){S.hitstop-=dt;return;}if(S.slowT>0){S.slowT-=dt;if(S.slowT<=0)S.slow=1;}dt*=S.slow;S.t+=dt;S.waveT+=dt;const p=S.p;
 if(AUTO)autopilot(dt);p.inv-=dt;p.fireT-=dt;const cad=.45/(1+.15*mod("cad"));if(p.fireT<=0&&S.en.length&&S.mode=="play"){fire();p.fireT=cad;}
 for(const b of S.pb){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;for(const e of S.en)if(!e.dead&&Math.hypot(e.x-b.x,e.y-b.y)<e.r+6){b.l=0;S.tel.hits++;e.burn=Math.max(e.burn,e.k=="boss"?1.5:3*(1+.5*mod("fuego")));hit(e,b.d);for(let i=0;i<4;i++)S.fx.push({x:b.x,y:b.y,vx:(rnd()-.5)*200,vy:(rnd()-.5)*200,l:.3,c:"#ffd27a",r:3});break;}}
 for(const e of S.en){if(e.dead)continue;if(e.burn>0){e.burn-=dt;e.bt=(e.bt||0)-dt;if(e.bt<=0){e.bt=.5;hit(e,e.k=="boss"?2:4,COL.reac);}}
  if(e.k=="barco"){const d=Math.hypot(p.x-e.x,p.y-e.y);e.ang=Math.atan2(p.y-e.y,p.x-e.x);const sp=d>260?70:-25;e.x+=Math.cos(e.ang)*sp*dt;e.y+=Math.sin(e.ang)*sp*dt;e.fireT-=dt;if(e.fireT<=0){e.fireT=2.4+rnd();S.eb.push({x:e.x,y:e.y,vx:Math.cos(e.ang)*230,vy:Math.sin(e.ang)*230,l:4});}}
  else bossAI(e,dt);}
 for(const b of S.eb){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(Math.hypot(b.x-p.x,b.y-p.y)<18){b.l=0;damageP(6);}}
 S.pb=S.pb.filter(b=>b.l>0);S.eb=S.eb.filter(b=>b.l>0);S.en=S.en.filter(e=>!e.dead);
 for(const f of S.fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.l-=dt;}S.fx=S.fx.filter(f=>f.l>0);for(const n of S.nums){n.y-=40*dt;n.l-=dt;}S.nums=S.nums.filter(n=>n.l>0);
 S.shake*=Math.pow(.02,dt);if(S.lineT>0)S.lineT-=dt;if(S.banner){S.banner.l-=dt;if(S.banner.l<=0)S.banner=null;}
 S.batchT-=dt;if(S.mode=="play"&&S.reserve>0&&(S.batchT<=0||S.en.length<2)){S.batchT=7;const k=Math.min(4,S.reserve);S.reserve-=k;const b0=rnd()*7;for(let i=0;i<k;i++){const a=b0+i*.5;S.en.push({k:"barco",x:W/2+Math.cos(a)*700,y:H/2+Math.sin(a)*420,hp:30+S.wave*8,mhp:30+S.wave*8,r:24,burn:0,fireT:1.5+rnd()*2,ang:0});}}
 if(S.mode=="play"&&!S.en.length&&!S.reserve&&!S.boss){if(S.wave==1)offerCards("w1");else if(S.wave==2)spawnWave(3);else if(S.wave==3)spawnBoss();}

function bossAI(b,dt){const p=S.p;b.phT-=dt;if(b.stun>0){b.stun-=dt;if(b.stun<=0)b.dmgX=1;return;}
 if(b.ph=="fan"){b.ang=Math.atan2(p.y-b.y,p.x-b.x);b.x+=(W/2+Math.sin(S.t*.6)*300-b.x)*dt;b.y+=(140-b.y)*dt;b.fT=(b.fT||1.3)-dt;if(b.fT<=0){b.fT=1.7;for(let i=-2;i<=2;i++){const a=b.ang+i*.2;S.eb.push({x:b.x,y:b.y,vx:Math.cos(a)*260,vy:Math.sin(a)*260,l:4});}boom(65,.3,.35);}
  if(b.phT<=0){b.ph="tell";b.tell=1.1;b.ang=Math.atan2(p.y-b.y,p.x-b.x);}}
 else if(b.ph=="tell"){b.tell-=dt;if(b.tell<=0){b.ph="ram";b.ramT=1.1;}}
 else if(b.ph=="ram"){b.x+=Math.cos(b.ang)*620*dt;b.y+=Math.sin(b.ang)*620*dt;b.ramT-=dt;if(Math.hypot(p.x-b.x,p.y-b.y)<b.r+16)damageP(22);
  if(b.ramT<=0||b.x<40||b.x>W-40||b.y<40||b.y>H-40){b.x=Math.max(50,Math.min(W-50,b.x));b.y=Math.max(50,Math.min(H-50,b.y));b.ph="fan";b.phT=4+rnd()*2;b.stun=3;b.dmgX=2;S.shake=10;boom(40,.6,.6);S.nums.push({x:b.x,y:b.y-60,t:"¡ATURDIDO! ×2",c:COL.crit,l:1.6,big:true});}}}
// ---------- dibujo ----------
function ship(x,y,a,s,hull,sail){g.save();g.translate(x,y);g.rotate(a);g.scale(s,s);g.fillStyle="rgba(255,255,255,.18)";g.beginPath();g.ellipse(-30,0,22,8,0,0,7);g.fill();g.fillStyle=hull;g.beginPath();g.moveTo(26,0);g.quadraticCurveTo(10,-12,-22,-10);g.lineTo(-22,10);g.quadraticCurveTo(10,12,26,0);g.fill();g.strokeStyle="#1a0e05";g.lineWidth=2;g.stroke();g.fillStyle=sail;g.fillRect(-6,-14,8,28);g.restore();}

 for(const e of S.en){if(e.k=="boss"){if(e.ph=="tell"){g.save();g.translate(e.x,e.y);g.rotate(e.ang);g.fillStyle="rgba(255,42,42,"+(.25+.25*Math.sin(S.t*30))+")";g.fillRect(0,-46,700,92);g.strokeStyle=COL.warn;g.lineWidth=3;g.strokeRect(0,-46,700,92);g.restore();}

  if(e.k!="boss"){g.fillStyle="#000a";g.fillRect(e.x-20,e.y-34,40,5);g.fillStyle="#e8e8e8";g.fillRect(e.x-20,e.y-34,40*e.hp/e.mhp,5);}}

 const p=S.p;if(!(p.inv>0&&(S.t*20|0)%2))ship(p.x,p.y,-Math.PI/2,1.3,"#2b3d52","#f2efe6");
 for(const f of S.fx){g.globalAlpha=Math.max(0,Math.min(1,f.l*2));g.fillStyle=f.c;g.beginPath();g.arc(f.x,f.y,f.r,0,7);g.fill();}g.globalAlpha=1;
 g.textAlign="center";for(const n of S.nums){g.globalAlpha=Math.min(1,n.l*2);g.fillStyle=n.c;g.font=`bold ${n.big?26:18}px system-ui`;g.strokeStyle="#000";g.lineWidth=3;g.strokeText(n.t,n.x,n.y);g.fillText(n.t,n.x,n.y);}g.globalAlpha=1;g.restore();
 // HUD (arriba izq. vida · centro oleada · der. pausa)
 g.fillStyle="#0008";g.fillRect(16,14,230,22);g.fillStyle="#3cd070";g.fillRect(18,16,226*p.hp/p.mhp,18);g.fillStyle="#fff";g.font="bold 14px system-ui";g.textAlign="left";g.fillText(`${Math.ceil(p.hp)}/${Math.round(p.mhp)}`,24,30);
 g.textAlign="center";g.font="bold 20px system-ui";g.fillText(S.boss?"JEFE · Barbaroja":`Oleada ${S.wave}/3 · quedan ${S.en.length+(S.reserve||0)}`,W/2,32);

 g.textAlign="left";g.font="12px system-ui";g.fillStyle="#9cc";g.fillText(S.cards.map(c=>CARDS.find(k=>k.id==c).ic).join(" "),16,52);
 if(S.lineT>0&&S.line){g.globalAlpha=Math.min(1,S.lineT);g.fillStyle="#000b";g.fillRect(W/2-330,H-96,660,24+S.line.length*24);g.fillStyle="#e6b94a";g.font="bold 15px system-ui";g.textAlign="left";g.fillText("DORIAN",W/2-318,H-78);g.fillStyle="#fff";g.font="18px system-ui";S.line.forEach((l,i)=>g.fillText(l,W/2-240,H-78+i*24));g.globalAlpha=1;}
 if(S.banner){g.globalAlpha=Math.min(1,S.banner.l*2);g.textAlign="center";g.font="bold 54px system-ui";g.strokeStyle="#000";g.lineWidth=6;g.fillStyle=COL.reac;g.strokeText(S.banner.t,W/2,H*.3);g.fillText(S.banner.t,W/2,H*.3);g.font="bold 20px system-ui";g.fillStyle="#fff";g.strokeText(S.banner.s,W/2,H*.3+36);g.fillText(S.banner.s,W/2,H*.3+36);g.globalAlpha=1;}}
// ---------- cofre, mapa, encuesta, telemetría ----------
function chest(){showUI(`<div class="box"><div style="font-size:70px">🧰</div><div style="border:4px solid ${RB.rara};border-radius:14px;padding:14px;margin:8px 0;background:#14202e"><div style="font-size:46px">❄</div><div style="color:${RB.rara};text-transform:uppercase;font-size:13px">Pieza rara</div><div style="font-size:20px">Cañón de Escarcha</div><div style="opacity:.75;font-size:14px">Ralentiza un 20% a lo que toca</div></div><button onclick="mapa()">Ver la carta náutica</button></div>`);if(AUTO)setTimeout(mapa,300);}
window.mapa=()=>{const seas=[["Mar Esmeralda","done"],["Niebla","next"],["Islas Ardientes","fog"],["Hielo","fog"],["Tormenta Eterna","fog"]];
 showUI(`<div class="box" style="background:#d9c08a;color:#3a2410;border-color:#7a5320"><div style="font-size:24px;font-weight:800">Carta náutica</div><div style="display:flex;gap:10px;margin:14px 0">`+seas.map(([n,s])=>`<div style="width:104px;height:110px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:${s=="done"?"#5aa87a":s=="next"?"#fff2b0":"#8a8f94"};box-shadow:${s=="next"?"0 0 24px #fff6":"none"};opacity:${s=="fog"?.55:1};font-size:13px;font-weight:700">${s=="done"?"⚑ ★★★":s=="next"?"⛵":"☁"}<div>${n}</div></div>`).join("")+`</div><button onclick="encuesta()">Terminar la partida</button></div>`);if(AUTO)setTimeout(encuesta,300);};
function stats(){const r=JSON.parse(localStorage.getItem("gk_p5_runs")||"[]"),n=r.length,boss=r.filter(x=>x.reachedBoss).length,fs=r.filter(x=>x.feel).map(x=>x.feel);return{runs:r,n,pctBoss:n?Math.round(boss/n*100):0,avgFeel:fs.length?+(fs.reduce((a,b)=>a+b,0)/fs.length).toFixed(2):null};}
function record(feel){const t=S.tel,r={v:"p5-1",date:new Date().toISOString(),wave:S.wave==4?"jefe":S.wave,timeS:Math.round((performance.now()-t.start)/1000),simTimeS:Math.round(S.t),accuracy:t.shots?+(t.hits/t.shots).toFixed(3):0,damageTaken:Math.round(t.dmgTaken),deaths:t.deaths,reachedBoss:t.reachedBoss,won:!!t.won,feel:feel||null,cards:S.cards};
 const a=JSON.parse(localStorage.getItem("gk_p5_runs")||"[]");a.push(r);localStorage.setItem("gk_p5_runs",JSON.stringify(a));S.recorded=true;return r;}
window.encuesta=()=>{S.mode="survey";showUI(`<div class="box st"><div style="font-size:24px;font-weight:800">¿Qué tal se sintió disparar?</div><div style="opacity:.7;margin:6px 0 12px">1 = flojo · 5 = genial</div>${[1,2,3,4,5].map(i=>`<button onclick="votar(${i})">${i}</button>`).join("")}<div style="opacity:.55;font-size:12px;margin-top:12px">Se guarda solo en este dispositivo. No se envía nada.</div></div>`);if(AUTO&&SHOT!="encuesta")setTimeout(()=>votar(4),300);};
window.votar=f=>{const r=record(f),s=stats();S.mode="done";showUI(`<div class="box"><div style="font-size:22px;font-weight:800">¡Gracias!</div><div style="text-align:left;margin:12px 0;line-height:1.6">Esta partida: oleada ${r.wave}, ${r.timeS} s, precisión ${Math.round(r.accuracy*100)}%, daño recibido ${r.damageTaken}<br>Partidas: <b>${s.n}</b> · llegan al jefe: <b>${s.pctBoss}%</b> · sensación media: <b>${s.avgFeel??"—"}</b>/5</div><button onclick="copiar()">Copiar datos</button><button onclick="location.reload()">Otra vez</button><div id="cp" style="font-size:12px;opacity:.7"></div></div>`);};
window.copiar=()=>{const j=JSON.stringify(stats(),null,1);(navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>document.getElementById("cp").textContent="Copiado ✓",()=>{const t=document.createElement("textarea");t.value=j;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();document.getElementById("cp").textContent="Copiado ✓";});};
addEventListener("pagehide",()=>{if(S&&!S.recorded&&S.t>5)record(null);});
// ---------- arranque ----------
let last=0;function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(S.mode=="fin"||S.mode=="play")step(dt);draw();requestAnimationFrame(loop);}
function start(){newRun();S.cards=[];spawnWave(1);}
// pruebas y autopiloto sin pantalla: simula con un paso fijo
function simulate(sec,stopFn){const dt=1/60;for(let i=0;i<sec*60;i++){if(S.mode=="play"||S.mode=="fin")step(dt);if(stopFn&&stopFn())return true;if(S.mode=="cards")pick(S.offer[0].id);}return false;}
function runTests(){const out=[],ok=(c,m)=>out.push((c?"OK ":"FALLO ")+m);
 newRun();S.cards=[];spawnWave(2);S.en=S.en.slice(-4);S.en.forEach(e=>e.burn=3);kill(S.en[0]);ok(S.chainShown&&S.book==1,"reacción en cadena con barcos de madera en llamas");
 newRun();S.cards=["triple5"];S.en=[{k:"barco",x:W/2,y:100,hp:999,mhp:999,r:24,burn:0,fireT:99,ang:0}];for(let i=0;i<5;i++)fire();ok(S.pb.length==7,"cada 5º disparo es triple (5 disparos = 7 balas: "+S.pb.length+")");
 newRun();S.cards=[];spawnBoss();ok(S.boss.hp==600,"Barbaroja con 600 de vida");S.boss.ph="ram";S.boss.ramT=.01;S.boss.ang=0;S.p.x=40;S.p.y=40;step(.02);ok(S.boss.stun>2.9&&S.boss.dmgX==2,"tras la embestida: aturdido 3 s y daño ×2");
 newRun();S.cards=[];S.mode="play";S.p.hp=5;damageP(10);ok(S.mode=="cards"&&S.offerReason=="respawn"&&S.p.hp==S.p.mhp,"al morir reapareces con +1 carta");pick(S.offer[0].id);ok(S.cards.length==1,"carta añadida tras reaparecer");
 localStorage.removeItem("gk_p5_runs");newRun();S.cards=[];S.tel.reachedBoss=true;S.tel.shots=10;S.tel.hits=7;record(4);newRun();S.cards=[];record(2);const s=stats();ok(s.n==2&&s.pctBoss==50&&s.avgFeel==3,"telemetría: 50% llega al jefe, sensación media 3");localStorage.removeItem("gk_p5_runs");
 ok(DORIAN[1].length<=2&&DORIAN[2].length<=2&&DORIAN[3].length<=2&&DORIAN.boss.length<=2,"Dorian: como mucho 2 líneas");
 const fails=out.filter(l=>l.startsWith("FALLO")).length;document.getElementById("out").textContent=out.join("\n")+"\nRESULTADO "+(fails?"FALLO "+fails:"OK "+out.length);}
function runSim(){mute=true;localStorage.removeItem("gk_p5_runs");start();const won=simulate(600,()=>S.mode=="fin"||(S.tel.won));const r=record(4);
 document.getElementById("out").textContent="SIM "+JSON.stringify({seed:Q.get("seed"),won:!!S.tel.won,reachedBoss:S.tel.reachedBoss,deaths:S.tel.deaths,t:Math.round(S.t),acc:r.accuracy,dmg:r.damageTaken,chains:S.qa.chains||0,bossS:Math.round(S.t-(S.bossAt||0)),cards:S.cards});}
if(TEST)runTests();else if(Q.get("sim"))runSim();
else{start();
 if(SHOT=="reaccion"){mute=true;S.en=[];spawnWave(2);S.p.x=W*.55;S.p.y=H*.45;S.en=S.en.slice(-4);S.en.push({k:"barco",x:W*.3,y:H*.7,hp:50,mhp:50,r:24,burn:0,fireT:9,ang:0});S.en.slice(0,4).forEach(e=>e.burn=3);simulate(.4);kill(S.en[0]);simulate(.25);S.eb.push({x:W*.45,y:H*.6,vx:0,vy:0,l:9},{x:W*.48,y:H*.63,vx:0,vy:0,l:9});S.slow=1;S.slowT=0;S.mode="snap";}
 if(SHOT=="boss"){mute=true;S.en=[];S.reserve=0;S.wave=3;spawnBoss();S.lineT=0;S.p.x=W*.5;S.p.y=H*.72;S.boss.hp=380;S.boss.ph="tell";S.boss.tell=.8;S.boss.ang=Math.atan2(S.p.y-S.boss.y,S.p.x-S.boss.x)+.25;S.cards=["triple5"];for(let i=0;i<9;i++)fire();simulate(.12);S.eb.push(...[-2,-1,0,1,2].map(i=>({x:S.boss.x+i*40+60,y:S.boss.y+120,vx:0,vy:0,l:9})));S.mode="snap";}
 if(SHOT=="encuesta"){mute=true;localStorage.setItem("gk_p5_runs",JSON.stringify([{reachedBoss:true,feel:4},{reachedBoss:true,feel:5},{reachedBoss:false,feel:3}]));S.mode="fin";S.en=[];S.reserve=0;S.lineT=0;S.wave=4;S.boss={dead:true,hp:0};S.tel.won=true;S.tel.reachedBoss=true;S.tel.shots=180;S.tel.hits=131;S.tel.dmgTaken=140;encuesta();if(Q.has("votar"))votar(4);}
 requestAnimationFrame(loop);}
window.GK5={get S(){return S},stats};
